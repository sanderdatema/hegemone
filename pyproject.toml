[project]
name = "betonning"
version = "0.1.0"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
description = "Self-hosted Kanban, tickets and knowledge for people and AI agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Sander Datema" }
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "python-multipart>=0.0.9",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
# MCP-server (memory-provider voor MCP-native agents zoals Claude Code).
# Installeer met: uv tool install '.[mcp]'  of  uv sync --extra mcp
mcp = [
    "mcp>=1.30,<2",
]

[project.urls]
Repository = "https://github.com/sanderdatema/hegemone"

[project.scripts]
betonning-mcp = "betonning.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mcp>=1.30,<2",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src/betonning"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
