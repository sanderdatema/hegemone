<style>

@media(min-width:1450px){.workspace{margin:24px auto;min-height:calc(100vh - 108px);border:1px solid var(--line);border-radius:10px;overflow:clip}}@media(max-width:1100px){.workspace{grid-template-columns:240px minmax(0,1fr)}.context{grid-column:2;border-left:0;border-top:1px solid var(--line);padding:24px 40px}.context .group{margin-top:20px}.context:not([hidden]){display:block}.main{padding:28px 32px}}@media(max-width:700px){.top{height:52px;padding:0 16px}.prototype{display:none}.workspace{display:flex;flex-direction:column;min-height:calc(100vh - 52px)}.workspace .nav{order:0}.workspace .context{order:1}.workspace .main{order:2}.mobilebar{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}.nav{display:none;border-right:0;border-bottom:1px solid var(--line)}.nav.open{display:block}.main{padding:24px 20px}.context{display:none!important;border-top:1px solid var(--line);padding:24px 20px}.context.open:not([hidden]){display:block!important}h1{font-size:27px}.reading{font-size:16px}.article-actions{margin-bottom:24px}.context.open{background:#fafbfc}.recent a{padding:16px 0}}

<div class="workspace"><nav class="nav" id="nav" aria-label="Knowledge base pages"><div class="navhead"><strong>Knowledge base</strong><button class="linkbutton" id="home">Home</button></div><small id="scopeLabel">Atlas project</small><div class="scope" aria-label="Page scope"><button aria-pressed="true" data-scope="Atlas">Project</button><button aria-pressed="false" data-scope="Global">Global</button></div><label for="search"><strong>Find a page</strong></label><div class="search"><input id="search" type="search" placeholder="Search titles and content"><button id="clear" aria-label="Clear search" hidden>×</button></div><button class="primary" id="new" style="width:100%">+ New page</button><div class="sort"><small id="count" aria-live="polite"></small><select id="sort" aria-label="Sort pages"><option value="alpha">Alphabetical</option><option value="recent">Recently updated</option></select></div><div id="list"></div></nav><main id="main" class="main" tabindex="-1"></main><aside id="context" class="context" aria-label="Article context"></aside></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div id="dialogActions" class="toolbar"></div></dialog>
<script>
const pages=[{title:'Getting started',slug:'getting-started',snippet:'A short guide to finding answers and keeping shared knowledge useful.',age:'Today',body:'Start with the project knowledge base. Search for a topic, or browse the page titles.'},{title:'Working agreements',slug:'working-agreements',snippet:'How we make decisions, record changes, and share the context behind our work.',age:'Yesterday',body:'Keep decisions close to the work. Write down the reason for a choice while the context is still fresh.'},{title:'Release checklist',slug:'release-checklist',snippet:'A practical release checklist for preparing, reviewing, and sharing a release.',age:'2 days ago',body:'Before a release, check the scope, review the changes, and confirm the recovery steps.'},{title:'Writing useful project notes for the next person who joins',slug:'writing-useful-notes',snippet:'Leave enough context for someone to understand a decision without asking the original author.',age:'3 days ago',body:'Useful notes explain the decision, the reason, and where to find more information.'},{title:'Project glossary',slug:'project-glossary',snippet:'Common terms used throughout the project.',age:'4 days ago',body:'Use familiar words consistently across project notes.'},{title:'Reviewing changes',slug:'reviewing-changes',snippet:'Give clear, actionable feedback and explain the reason behind each request.',age:'Last week',body:'Reviews help us share context and improve the work.'},{title:'Planning a small milestone',slug:'planning-milestones',snippet:'Keep milestones focused on a useful, reviewable outcome.',age:'Last week',body:'A milestone describes an outcome people can use.'}];
let selected=null,editing=false,dirty=false,scope='Atlas',preview=false,shownState='',currentTitle='',currentBody='';const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function modal(title,body,actions=[['Close',()=>{}]]){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;$('#dialogActions').replaceChildren();actions.forEach(([name,fn])=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>{$('#dialog').close();fn()};$('#dialogActions').append(b)});$('#dialog').showModal()}
function guard(fn){if(dirty)modal('Discard unsaved changes?','<p>Your changes have not been saved. Keep editing, or discard them to leave this page.</p>',[['Keep editing',()=>{}],['Discard changes',()=>{dirty=false;fn()}]]);else fn()}
function navlist(){let q=$('#search').value.trim().toLowerCase();$('#clear').hidden=!q;let result=pages.filter(p=>(p.title+' '+p.slug+' '+p.body+' '+p.snippet).toLowerCase().includes(q));if($('#sort').value==='alpha')result.sort((a,b)=>a.title.localeCompare(b.title));$('#count').textContent=q?result.length+' results':pages.length+' pages';$('#list').innerHTML=result.map(p=>`<a href="#${p.slug}" class="pagelink ${selected===p?'active':''}" ${selected===p?'aria-current="page"':''} data-page="${p.slug}">${esc(p.title)}${q?`<small>${esc(p.snippet)}</small>`:''}</a>`).join('')||(q?'<p class="muted">No pages match. Try another term or clear the search.</p>':'');$('#list').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();openPage(a.dataset.page)});if(!selected&&!editing)render()}
function openPage(slug){guard(()=>{selected=pages.find(p=>p.slug===slug)||pages[0];editing=false;shownState='';location.hash=selected.slug;render();navlist();$('#nav').classList.remove('open');$('#pagesToggle').setAttribute('aria-expanded','false');$('#main').focus()})}
function fixture(){return `<div class="fixturebar"><span class="muted">Preview states</span>${['Empty','Loading','Error','Conflict'].map(x=>`<button data-state="${x.toLowerCase()}">${x}</button>`).join('')}</div>`}
function render(){const m=$('#main'),c=$('#context');c.hidden=!selected||editing;$('#tocToggle').hidden=!selected||editing;let q=$('#search').value.trim();if(shownState&&shownState!=='conflict'){m.innerHTML=`<div class="breadcrumb">${esc(scope)} / Knowledge base</div><div class="state" ${shownState==='error'?'role="alert"':'role="status"'}><h1>${{empty:'A fresh place for shared knowledge',loading:'Loading knowledge base…',error:'We couldn’t load these pages'}[shownState]}</h1><p class="muted">${{empty:'Create the first page to share a guide, decision, or useful reference.',loading:'Your pages will appear here shortly.',error:'Check your connection and try again. Your saved pages have not changed.'}[shownState]}</p><button id="recover">${shownState==='empty'?'Create first page':shownState==='error'?'Try again':'Show loaded pages'}</button></div>${fixture()}`;$('#recover').onclick=()=>{shownState='';if($('#recover').textContent==='Create first page')startEdit(true);else render()};bindFixtures();return}
if(editing){m.innerHTML=`<div class="breadcrumb">${esc(scope)} / Knowledge base / ${selected?'Edit page':'New page'}</div><h1>${selected?'Edit page':'New page'}</h1><p class="muted">Write a useful title and keep the context in the page.</p>${shownState==='conflict'?'<div class="notice" role="alert"><strong>This page changed while you were editing.</strong><br>Your draft is still here. Open the latest version before merging your changes. Saving will not overwrite it.<br><button id="latest">View latest version</button></div>':''}<div class="editor"><label for="title">Page title</label><input id="title" value="${esc(currentTitle)}" placeholder="Give this page a clear title"><div class="toolbar"><button id="write" aria-pressed="${!preview}">Write</button><button id="preview" aria-pressed="${preview}">Preview</button><small>Markdown · [[page-links]] supported</small></div>${preview?`<div class="reading callout"><h2>${esc(currentTitle||'Untitled page')}</h2><pre>${esc(currentBody)}</pre></div>`:`<label for="body">Content</label><textarea id="body">${esc(currentBody)}</textarea>`}<div class="toolbar"><button class="primary" id="save" ${shownState==='conflict'?'disabled':''}>Save page</button><button id="cancel">Cancel</button><small id="dirty">${dirty?'Unsaved changes':'No unsaved changes'}</small></div></div>${fixture()}`;$('#title').oninput=e=>{currentTitle=e.target.value;dirty=true;$('#dirty').textContent='Unsaved changes'};if($('#body'))$('#body').oninput=e=>{currentBody=e.target.value;dirty=true;$('#dirty').textContent='Unsaved changes'};$('#preview').onclick=()=>{preview=true;render()};$('#write').onclick=()=>{preview=false;render()};$('#cancel').onclick=()=>guard(()=>{editing=false;shownState='';render()});$('#save').onclick=()=>{if(!currentTitle.trim()){modal('A title is required','<p>Give this page a title before saving.</p>');return}if(!selected){selected={title:currentTitle,body:currentBody,slug:'new-page-'+pages.length,snippet:currentBody.slice(0,100),age:'Just now'};pages.push(selected)}else {selected.title=currentTitle;selected.body=currentBody}dirty=false;editing=false;shownState='';render();navlist()};if($('#latest'))$('#latest').onclick=()=>modal('Latest saved version','<p>This is the latest saved content. Your draft remains open behind this window.</p><pre>'+esc(selected?.body||'A newer page version.')+'</pre>');bindFixtures();return}
if(!selected){m.innerHTML=`<div class="breadcrumb">${esc(scope)} / Knowledge base</div><h1>${q?'Search results':scope==='Atlas'?'Atlas knowledge base':'Global knowledge base'}</h1><p class="lead">${q?'Pages matching “'+esc(q)+'” in '+esc(scope)+'.':'A shared place for the decisions, guides, and context that help us work well together.'}</p><p class="meta">${pages.length} pages · ${scope==='Atlas'?'Project knowledge':'Shared across projects'}</p>${!q?'<h2>Recently updated</h2>':''}<div class="recent">${pages.filter(p=>!q||(p.title+' '+p.body+' '+p.slug+' '+p.snippet).toLowerCase().includes(q.toLowerCase())).slice(0,q?99:4).map(p=>`<a href="#${p.slug}" data-page="${p.slug}"><strong>${esc(p.title)}</strong><p>${esc(p.snippet)}</p><small>Updated ${p.age.toLowerCase()}</small></a>`).join('')||'<p>No pages match this search. Try fewer words or clear the search.</p>'}</div>${fixture()}`;m.querySelectorAll('[data-page]').forEach(a=>a.onclick=e=>{e.preventDefault();openPage(a.dataset.page)});bindFixtures();return}
m.innerHTML=`<div class="breadcrumb"><button class="linkbutton" id="crumb">Knowledge base</button><span>/</span><span>${esc(scope)}</span></div><h1>${esc(selected.title)}</h1><p class="meta">Updated ${selected.age.toLowerCase()} · ${esc(scope)} knowledge</p><div class="article-actions"><button id="edit">✎ Edit page</button><details class="menu"><summary aria-label="Page menu">•••</summary><div>${['Page details','History','Protect page','Delete page'].map(x=>`<button data-action="${x}" class="${x==='Delete page'?'danger':''}">${x}</button>`).join('')}</div></details></div><article class="reading"><p class="lead">${esc(selected.snippet)}</p><h2 id="overview">Overview</h2><p>${esc(selected.body)}</p><p>Keep this page focused on what someone needs to understand and do next. Link to related pages when they provide useful context.</p><div class="callout"><strong>Start with the reason</strong><br>A short explanation of why a decision was made is often more useful than a long list of instructions.</div><h2 id="practice">Putting it into practice</h2><ol><li>Describe the outcome in plain language.</li><li>Record the decision and enough context to understand it.</li><li>Review the page when the way we work changes.</li></ol><h2 id="related">Related reading</h2><p>Use the <a href="#project-glossary" data-page="project-glossary">project glossary</a> for shared terms, or read <a href="#reviewing-changes" data-page="reviewing-changes">Reviewing changes</a> for practical feedback.</p></article>${fixture()}`;
c.innerHTML=`<h3>On this page</h3><a href="#overview">Overview</a><a href="#practice">Putting it into practice</a><a href="#related">Related reading</a><div class="group"><h3>Linked from <small>6</small></h3>${pages.filter(p=>p!==selected).slice(0,5).map(p=>`<a href="#${p.slug}" data-page="${p.slug}">${esc(p.title)}</a>`).join('')}<button class="linkbutton" id="more">Show all references (6)</button><p class="muted">References in this knowledge base.</p></div>`;
$('#edit').onclick=()=>startEdit(false);$('#crumb').onclick=()=>guard(()=>{selected=null;history.replaceState(null,'',location.pathname);render();navlist()});document.querySelectorAll('[data-page]').forEach(a=>a.onclick=e=>{e.preventDefault();openPage(a.dataset.page)});$('#more').onclick=()=>modal('All references (6)','<p>Pages linking here in the current knowledge base.</p>'+pages.filter(p=>p!==selected).map(p=>`<p><a href="#${p.slug}" data-modalpage="${p.slug}">${esc(p.title)}</a></p>`).join(''));c.onclick=e=>{if(e.target.closest('a[href^="#"]')&&!e.target.dataset.page){c.classList.remove('open');$('#tocToggle').setAttribute('aria-expanded','false')}};m.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{m.querySelector('details').open=false;let a=b.dataset.action;if(a==='Page details')modal(a,`<p>Scope: ${esc(scope)}</p><p>Page identifier: <code>${esc(selected.slug)}</code></p><p>Source: human-authored · Revision: 3</p>`);else if(a==='History')modal('Page history','<p><strong>Today · Revision 3</strong><br>Clarified the practical steps.</p><p>Yesterday · Revision 2<br>Added related reading.</p><p>Restoring a revision requires a separate confirmation in the application.</p>');else if(a==='Protect page')modal('Protect this page?','<p>Agent changes will require human review. People can continue to edit this page.</p>',[['Cancel',()=>{}],['Protect page',()=>modal('Page protected','<p>This is a prototype. No permissions were changed.</p>')]]);else modal('Delete this page?','<p>The page will be removed from the knowledge base. This action is only available to people with permission.</p>',[['Cancel',()=>{}],['Delete page',()=>modal('Prototype only','<p>No page was deleted.</p>')]])});bindFixtures()}
function startEdit(create){guard(()=>{if(create)selected=null;currentTitle=selected?.title||'';currentBody=selected?.body||'';editing=true;preview=false;shownState='';render();$('#title').focus()})}
function bindFixtures(){document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{shownState=b.dataset.state;if(shownState==='conflict'){if(!editing){selected=selected||pages[0];currentTitle=selected.title;currentBody=selected.body;editing=true}dirty=true}render()})}
$('#search').oninput=()=>{navlist()};$('#clear').onclick=()=>{$('#search').value='';navlist();$('#search').focus()};$('#sort').onchange=navlist;$('#new').onclick=()=>startEdit(true);$('#home').onclick=()=>guard(()=>{selected=null;editing=false;shownState='';$('#search').value='';history.replaceState(null,'',location.pathname);render();navlist()});document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>guard(()=>{scope=b.dataset.scope;selected=null;editing=false;shownState='';$('#search').value='';$('#scopeLabel').textContent=scope==='Atlas'?'Atlas project':'All projects';document.querySelectorAll('[data-scope]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();navlist()}));for(const [button,panel] of [['pagesToggle','nav'],['tocToggle','context']])$('#'+button).onclick=()=>{let open=$('#'+panel).classList.toggle('open');$('#'+button).setAttribute('aria-expanded',open)};$('#dialog').addEventListener('click',e=>{if(e.target.dataset.modalpage){e.preventDefault();$('#dialog').close();openPage(e.target.dataset.modalpage)}});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});window.addEventListener('hashchange',()=>{let slug=location.hash.slice(1);if(pages.some(p=>p.slug===slug)&&selected?.slug!==slug)openPage(slug)});let initial=location.hash.slice(1);if(pages.some(p=>p.slug===initial))selected=pages.find(p=>p.slug===initial);navlist();render();
</script></html>
